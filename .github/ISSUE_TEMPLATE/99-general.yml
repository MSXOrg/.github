---
# GitHub issue form syntax.
name: 🌞 [Other]
description: Submit an issue with any other topic
title: '🌞 [Other]: '
labels: ['triage']
# GitHub issue form schema.
body:
  - type: markdown
    attributes:
      value: |
        This form records the subject and related information for an issue
        that does not fit the other forms.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Give the subject of the issue and the related information.
    validations:
      required: true
