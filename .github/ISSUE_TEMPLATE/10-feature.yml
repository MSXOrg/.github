---
# GitHub issue form syntax and schema.
name: 🚀 [Feature]
description: Suggest/request a new feature
title: '🚀[Feature]: '
labels: ['feature', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Describe what you need and the result you expect.
        You do not need to propose a technical solution
        or use a special format.

        See [issue planning][planning] and [issue routing][routing].

        This form collects feedback. Maintainers record internal plans
        in separate issues linked to the feedback.

        [planning]: https://msx.no/docs/Ways-of-Working/Issues/Process/Planning/
        [routing]: https://msx.no/docs/Ways-of-Working/Issues/Types/Hierarchy/
  - type: textarea
    id: description
    attributes:
      label: Describe the need
      description: |
        Describe what you need to do and who benefits.
        Explain why this matters. Describe the problem or opportunity.
        Describe the expected behavior. Give a short example of the situation,
        the action you take, and the result you expect.
        If a failure or limit changes what you expect, include an example.
    validations:
      required: true
