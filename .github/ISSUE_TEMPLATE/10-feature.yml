---
# GitHub issue form syntax and schema.
name: 🚀 [Feature]
description: Suggest/request a new feature
title: '🚀[Feature]: '
labels: ['feature', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Tell us what you need and what
        you expect to happen. You do not need to propose a technical solution
        or use a special format.

        See [issue planning][planning] and [issue routing][routing].

        This form collects feedback. Maintainers will link any internal
        planning work separately.

        [planning]: https://msx.no/docs/Ways-of-Working/Issues/Process/Planning/
        [routing]: https://msx.no/docs/Ways-of-Working/Issues/Types/Hierarchy/
  - type: textarea
    id: description
    attributes:
      label: Describe the need
      description: |
        What are you trying to do, and who would benefit?
        Why does this matter? Describe the problem or opportunity.
        What should happen? Give a short example of the situation,
        the action you take, and the result you expect.
        If a failure or limit changes what you expect, include that example too.
    validations:
      required: true
