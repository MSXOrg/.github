---
# GitHub issue form syntax.
name: 🪲 [Bug]
description: Submit a bug report
title: '🪲[Bug]: '
labels: ['bug', 'triage']
# GitHub issue form schema.
body:
  - type: markdown
    attributes:
      value: |
        This form records the expected and actual behavior, environment, steps
        to reproduce the problem, related information, and evidence.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: >-
        Give the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Give the version, commit, platform, or configuration in use when
        the problem occurred.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Give the steps, commands, inputs, or conditions that reproduce the
        problem.
    validations:
      required: true
  - type: textarea
    id: relevant-details
    attributes:
      label: Relevant details
      description: >-
        Include related code, configuration, logs, screenshots, links, or
        other context.
  - type: textarea
    id: supporting-evidence
    attributes:
      label: Supporting evidence
      description: |
        Include error messages, logs, screenshots, links, or other evidence
        of the problem.
