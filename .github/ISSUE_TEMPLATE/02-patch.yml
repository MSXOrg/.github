---
# GitHub issue form syntax.
name: 🩹 [Patch]
description: Submit a request to improve or change something that already exists
title: '🩹 [Patch]: '
labels: ['patch', 'triage']
# GitHub issue form schema.
body:
  - type: markdown
    attributes:
      value: |
        This form records the change you want to existing content or behavior.
  - type: textarea
    id: description
    attributes:
      label: Describe the change
      description: >-
        Give the existing content or behavior and the change you want.
    validations:
      required: true
